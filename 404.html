<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | this pump's empty | StaFull</title>
<meta name="description" content="The page you're looking for isn't on the route. Head back to StaFull.">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px}
  .nf-inner{max-width:560px}
  .nf-logo{width:52px;height:52px;margin:0 auto 26px}
  .nf-code{font-family:var(--mono);font-size:clamp(5rem,18vw,9rem);font-weight:700;line-height:1;
    letter-spacing:-.04em;color:var(--fg);position:relative}
  .nf-code .accent{color:var(--fg)}
  .nf h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:18px 0 14px}
  .nf p{color:var(--fg-2);font-size:1.05rem;max-width:42ch;margin:0 auto 30px}
  .nf-bar{max-width:300px;margin:0 auto 32px;text-align:left}
  .nf-bar .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;color:var(--fg-3);margin-bottom:8px}
  .nf-bar .track{height:12px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);
    border:1px solid var(--line);overflow:hidden}
  .nf-bar .fill{display:block;height:100%;width:4%;border-radius:var(--r-pill);
    background:var(--red-grad);box-shadow:0 0 14px rgba(163,0,0,.5)}
</style>
</head>
<body>
<main class="nf">
  <div class="nf-inner">
    <img class="nf-logo" src="logo.svg" alt="StaFull">
    <div class="nf-code">4<span class="accent">0</span>4</div>
    <h1>This pump's empty.</h1>
    <p>The page you're looking for isn't on the route. Let's get you back to where the fuel is.</p>
    <div class="nf-bar">
      <div class="l"><span>Page found</span><span>4%</span></div>
      <div class="track"><span class="fill"></span></div>
    </div>
    <a href="/" class="btn btn-red btn-lg">Back to home &rarr;</a>
  </div>
</main>
</body>
</html>
